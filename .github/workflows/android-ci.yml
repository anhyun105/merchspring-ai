name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Assemble debug APK and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle Wrapper validation and caching
        uses: gradle/actions/setup-gradle@v6

      - name: Install required Android SDK packages
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-not set}"
          test -n "${ANDROID_HOME:-}" || { echo "ANDROID_HOME is missing on this runner" >&2; exit 1; }
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" || { echo "Could not find sdkmanager under $ANDROID_HOME/cmdline-tools" >&2; exit 1; }
          printf 'y\n%.0s' {1..50} | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36.1" "build-tools;36.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Create an ephemeral debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -dname "CN=CI Android Debug,O=MerchSpring AI,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Assemble debug APK and run unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK for testers
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: merchspring-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
